name: daily-post

on:
  schedule:
    # JA: 11:00 UTC = 20:00 JST（日本のゴールデンタイム）
    - cron: "0 11 * * *"
    # EN: 23:00 UTC = 20:00 ブラジル / 19:00 米東部 / 16:00 米西部（欧州は深夜）
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      langs:
        description: "投稿する言語（カンマ区切り。例: ja / en / ja,en）"
        required: false
        default: "ja,en"

permissions:
  contents: write
  issues: write # キュー残量の警告Issueを立てる

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve target langs
        id: target
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_LANGS: ${{ inputs.langs }}
        run: |
          case "$SCHEDULE" in
            "0 11 * * *") langs="ja" ;;
            "0 23 * * *") langs="en" ;;
            *) langs="${INPUT_LANGS:-ja,en}" ;;
          esac
          echo "langs=$langs" >> "$GITHUB_OUTPUT"
          echo "投稿対象: $langs (schedule='$SCHEDULE')"

      - name: Post to Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID_JA: ${{ secrets.IG_USER_ID_JA }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/output
          POST_LANGS: ${{ steps.target.outputs.langs }}
        run: python3 post_to_instagram.py

      - name: Commit posted state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posted.json
          git diff --cached --quiet || git commit -m "chore: update posted state (${{ steps.target.outputs.langs }}) [skip ci]"
          git pull --rebase --autostash || true
          git push

      # queueが尽きても投稿スクリプトは正常終了するため、残量を別途チェックして通知する
      - name: Check queue level
        id: queue
        if: always()
        env:
          QUEUE_WARN_DAYS: "3"
        run: python3 check_queue.py

      # Issueの重複判定はラベルで行う（日本語タイトルの全文検索は取りこぼすため）
      - name: Notify if queue is low
        if: always() && steps.queue.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create queue-low --color D93F0B --description "投稿キューの残量警告" --force
          existing=$(gh issue list --state open --label queue-low --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "既にIssue #$existing がオープン中。重複作成しません"
            exit 0
          fi
          gh issue create \
            --title "投稿キューの残りが ${{ steps.queue.outputs.remaining }}日分になりました" \
            --label queue-low \
            --body-file queue_alert.md

      - name: Close notice when queue is refilled
        if: always() && steps.queue.outputs.low == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ラベル未作成でも issue list は空を返すので、ここでは作らない
          for n in $(gh issue list --state open --label queue-low --json number --jq '.[].number'); do
            gh issue close "$n" --comment "キューが補充されたため自動クローズします（残り ${{ steps.queue.outputs.remaining }}日分）"
          done
