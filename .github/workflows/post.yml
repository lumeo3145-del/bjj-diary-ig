name: daily-post

on:
  schedule:
    # 混雑を避けるため 00 分を回避。スクリプトは冪等なので複数回起動しても
    # 既投稿分はスキップされる。JSTの当日中に最終リトライまで完走する。
    - cron: "17 12 * * *" # 12:17 UTC = 21:17 JST（メイン）
    - cron: "29 13 * * *" # 13:29 UTC = 22:29 JST（リトライ1）
    - cron: "41 14 * * *" # 14:41 UTC = 23:41 JST（リトライ2・最終）
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post to Instagram (JA + EN)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID_JA: ${{ secrets.IG_USER_ID_JA }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/output
        run: python3 post_to_instagram.py

      - name: Commit posted state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posted.json
          git diff --cached --quiet || git commit -m "chore: update posted state [skip ci]"
          git push
