name: refresh-token

on:
  schedule:
    - cron: "0 3 1 * *" # 毎月1日 03:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh long-lived token
        id: refresh
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          NEW_TOKEN=$(python3 refresh_token.py)
          echo "::add-mask::$NEW_TOKEN"
          echo "token=$NEW_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Update repository secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} # secrets:write 権限付きのPAT
        run: |
          gh secret set META_ACCESS_TOKEN \
            --repo "${{ github.repository }}" \
            --body "${{ steps.refresh.outputs.token }}"
